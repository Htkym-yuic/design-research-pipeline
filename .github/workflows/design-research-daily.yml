name: Design Research Daily

on:
  workflow_dispatch:
  push:
    branches:
      - main
  schedule:
    # 09:00 JST daily
    - cron: "0 0 * * *"

jobs:
  screenshot-test:
    name: Screenshot reference sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Extract LP Archive candidates
        run: npm run extract:lp:test

      - name: Capture screenshots
        run: npm run capture:test

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-extraction-results
          path: candidates/
          if-no-files-found: error

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: screenshots/test-run/
          if-no-files-found: error
