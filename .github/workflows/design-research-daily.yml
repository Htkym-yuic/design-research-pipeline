name: Design Research Daily

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST daily
    - cron: "0 0 * * *"

jobs:
  prepare:
    name: Prepare research pipeline
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Show pipeline status
        run: |
          echo "Design Research Pipeline"
          echo "Dropbox root: /design/Design_Research_Library/"
          echo "Knowledge output: knowledge/"
          echo "CBS export: exports/creative-brief-studio-ai/"
          echo "Next step: add screenshot capture, Dropbox upload, Notion registration, and CBS sync."
