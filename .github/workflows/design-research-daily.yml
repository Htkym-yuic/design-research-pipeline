name: Design Research Daily

on:
  workflow_dispatch:
  schedule:
    # 09:00 JST daily
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  screenshot-test:
    name: Screenshot reference sources
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        run: npm ci

      - name: Install browser
        run: npx playwright install --with-deps chromium

      - name: Extract LP Archive candidates
        run: RESERVE_LP_IDS=true npm run extract:lp:test

      - name: Commit candidate reservation
        run: |
          if git diff --quiet -- candidates/lp-archive/candidates.json data/id-counters.json; then
            echo "No candidate reservation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/lp-archive/candidates.json data/id-counters.json
          git commit -m "Reserve daily LP candidate IDs"
          git push

      - name: Capture LP candidate screenshots
        run: LP_CANDIDATES_FILE=candidates/lp-archive/fixtures/lp-0214-awarefy.json LP_CANDIDATE_LIMIT=1 LP_SECTION_LIMIT=6 npm run capture:lp:candidates

      - name: Capture screenshots
        timeout-minutes: 5
        run: npm run capture:test

      - name: Upload candidate artifact
        uses: actions/upload-artifact@v4
        with:
          name: candidate-extraction-results
          path: candidates/
          if-no-files-found: error

      - name: Upload screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: screenshots/test-run/
          if-no-files-found: error

      - name: Upload LP candidate screenshot artifact
        uses: actions/upload-artifact@v4
        with:
          name: lp-candidate-screenshot-results
          path: screenshots/lp-candidates/
          if-no-files-found: error
