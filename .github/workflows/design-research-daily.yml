name: Design Research Daily

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true=Dropbox/Notionへ書き込まない安全モード、false=本番反映"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      refresh_candidates:
        description: "true=新規候補を抽出・採番、false=確認済み候補を再利用"
        type: choice
        options:
          - "true"
          - "false"
        default: "true"
      candidate_file:
        description: "復旧時のみ候補JSONを指定。空欄は通常の日次候補を使用"
        type: string
        default: ""
      candidate_limit:
        description: "手動実行で処理する候補数。空欄は日次設定を使用"
        type: string
        default: ""
      force_run:
        description: "true=当日成功済みでも再実行"
        type: choice
        options:
          - "false"
          - "true"
        default: "false"
  schedule:
    # GitHubの毎時混雑を避け、01:37 JSTに本実行。01:52 JSTは未完了時のみ動く予備便。
    - cron: "37 16 * * *"
    - cron: "52 16 * * *"

concurrency:
  group: design-research-daily-intake
  cancel-in-progress: false

permissions:
  contents: write

env:
  DROPBOX_APP_KEY: ${{ secrets.DROPBOX_APP_KEY }}
  DROPBOX_APP_SECRET: ${{ secrets.DROPBOX_APP_SECRET }}
  DROPBOX_REFRESH_TOKEN: ${{ secrets.DROPBOX_REFRESH_TOKEN }}
  NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
  DROPBOX_DESIGN_ROOT: ${{ vars.DROPBOX_DESIGN_ROOT }}
  NOTION_LP_DATA_SOURCE_ID: ${{ vars.NOTION_LP_DATA_SOURCE_ID }}
  # 手動実行時の入力 > リポジトリVariable > 既定値(true=安全側) の優先順位。
  # スケジュール実行では inputs が空文字になるため vars.DRY_RUN 以降にフォールバックする。
  DRY_RUN: ${{ github.event.inputs.dry_run || vars.DRY_RUN || 'true' }}
  LP_CANDIDATES_FILE: ${{ github.event.inputs.candidate_file || 'candidates/lp-archive/candidates.json' }}

jobs:
  lp-daily-intake:
    name: LP daily intake (collect → Dropbox → Notion)
    runs-on: ubuntu-latest
    env:
      DAILY_LP_LIMIT: ${{ github.event.inputs.candidate_limit || vars.DAILY_LP_LIMIT || '2' }}
      CANDIDATE_SCAN_LIMIT: ${{ vars.LP_CANDIDATE_SCAN_LIMIT || '40' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Check whether today's intake already succeeded
        id: guard
        env:
          FORCE_RUN: ${{ github.event.inputs.force_run || 'false' }}
        run: npm run daily:check

      - name: Setup Node.js
        if: steps.guard.outputs.skip != 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Install dependencies
        if: steps.guard.outputs.skip != 'true'
        run: npm ci

      - name: Check required Secrets / Variables
        if: steps.guard.outputs.skip != 'true'
        run: npm run check:env

      - name: Install browser
        if: steps.guard.outputs.skip != 'true'
        run: npx playwright install --with-deps chromium

      - name: Extract LP Archive candidates
        if: steps.guard.outputs.skip != 'true' && (github.event_name == 'schedule' || github.event.inputs.refresh_candidates != 'false')
        env:
          CANDIDATE_LIMIT: ${{ env.DAILY_LP_LIMIT }}
          CANDIDATE_SCAN_LIMIT: ${{ vars.LP_CANDIDATE_SCAN_LIMIT || '40' }}
          RESERVE_LP_IDS: ${{ env.DRY_RUN == 'true' && 'false' || 'true' }}
        run: npm run extract:lp:test

      - name: Commit candidate reservation
        if: steps.guard.outputs.skip != 'true' && env.DRY_RUN != 'true' && (github.event_name == 'schedule' || github.event.inputs.refresh_candidates != 'false')
        run: |
          if git diff --quiet -- candidates/lp-archive/candidates.json candidates/lp-archive/intake-reservations.json data/id-counters.json; then
            echo "No candidate reservation changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add candidates/lp-archive/candidates.json candidates/lp-archive/intake-reservations.json data/id-counters.json
          git commit -m "Reserve daily LP candidate IDs"
          git push

      - name: Capture LP candidate screenshots
        if: steps.guard.outputs.skip != 'true'
        env:
          LP_CANDIDATE_LIMIT: ${{ env.DAILY_LP_LIMIT }}
          LP_SECTION_LIMIT: "6"
        run: npm run capture:lp:candidates

      - name: Capture reference source screenshots
        if: steps.guard.outputs.skip != 'true'
        timeout-minutes: 5
        run: npm run capture:test

      - name: Generate daily lightweight analysis
        if: steps.guard.outputs.skip != 'true'
        run: npm run analyze:lp:light

      - name: Upload to Dropbox
        if: always() && steps.guard.outputs.skip != 'true'
        run: npm run dropbox:upload:lp

      - name: Register to Notion
        if: always() && steps.guard.outputs.skip != 'true'
        run: npm run notion:register:lp

      - name: Write step summary
        if: always() && steps.guard.outputs.skip != 'true'
        run: npm run report:lp:summary

      - name: Mark successful daily intake
        if: success() && steps.guard.outputs.skip != 'true' && env.DRY_RUN != 'true'
        run: |
          npm run daily:mark
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/daily-run-state.json candidates/lp-archive/lightweight-analysis.json
          git commit -m "Record successful daily design intake" || exit 0
          git pull --rebase origin main
          git push

      - name: Upload candidate artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: candidate-extraction-results
          path: candidates/
          if-no-files-found: warn

      - name: Upload screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-test-results
          path: screenshots/test-run/
          if-no-files-found: warn

      - name: Upload LP candidate screenshot artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: lp-candidate-screenshot-results
          path: screenshots/lp-candidates/
          if-no-files-found: warn
