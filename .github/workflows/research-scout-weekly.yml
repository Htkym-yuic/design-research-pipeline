name: Research Scout Weekly

on:
  workflow_dispatch:
    inputs:
      fingerprint:
        description: "調査する指紋（カンマ区切り）。空欄はscripts/scout/fingerprints.mjsの全件"
        type: string
        default: ""
      sample:
        description: "指紋ごとに抽出するリポジトリ数"
        type: string
        default: "30"
      count_only:
        description: "true=規模の目安のみ表示し、サンプリングしない"
        type: choice
        options: ["false", "true"]
        default: "true"
  schedule:
    # 週1回、月曜 00:00 JST（日曜 15:00 UTC）。daily-intakeとは別のconcurrency group。
    - cron: "0 15 * * 0"

concurrency:
  group: research-scout-weekly
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  scout-collect:
    name: Design Research Scout collector (draft-only, no LLM API)
    runs-on: ubuntu-latest
    env:
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Run pure-function unit tests
        run: npm run scout:test

      - name: Collect (count-only or sample, per inputs)
        run: |
          FP="${{ github.event.inputs.fingerprint }}"
          SAMPLE="${{ github.event.inputs.sample }}"
          COUNT_ONLY="${{ github.event.inputs.count_only }}"
          if [ -z "$FP" ]; then
            FP="tailwind.config.js,tailwind.config.ts,design-tokens.json,figma.config.js,.storybook"
          fi
          if [ -z "$SAMPLE" ]; then SAMPLE="30"; fi
          if [ "$COUNT_ONLY" = "false" ]; then
            node scripts/scout/index.mjs --fingerprint="$FP" --sample="$SAMPLE"
          else
            node scripts/scout/index.mjs --fingerprint="$FP" --count-only
          fi

      # 自動コミットの方針: total_count（規模の目安）とサンプルCSVは、解釈を伴わない
      # 機械的な数値・生データなので直接コミットする（daily-intakeの候補予約と同じ扱い）。
      # 一方、docs/scout/scan-log.mdへの観察文（「選んだ候補」等の判断）は対象外。
      # 新規性ゲート（scan-config.md）の判断が要るため、Claudeが内容を読んで
      # 手動で追記する運用のまま変えない。
      - name: Commit count-history and sample drafts (mechanical data only)
        run: |
          if [ -z "$(git status --porcelain -- docs/scout/count-history.csv docs/scout/drafts/)" ]; then
            echo "No mechanical scout data changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/scout/count-history.csv docs/scout/drafts/
          git commit -m "Record weekly Scout count-history and sample drafts" || exit 0
          git pull --rebase origin main
          git push

      - name: Upload drafts/CSV artifact
        uses: actions/upload-artifact@v4
        with:
          name: research-scout-drafts
          path: docs/scout/drafts/
          if-no-files-found: ignore
